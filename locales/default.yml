components:
  command.settings.view:
    - type: container
      components:
        - "# {guild_name}の設定"
        - type: separator
        - "## BUMP通知設定"
        - |-
          - **Bump通知**：{bump_enabled}
          - **Bump通知メッセージ**：
          ```
          {bump_message_title}
          ``````
          {bump_message}
          ```
          - **Bumpリマインド通知**：
          ```
          {bump_remind_message_title}
          ``````
          {bump_remind_message}
          ```
          - **Bump通知ロール**：{bump_mention}
        - "## UP通知設定"
        - |-
          - **UP通知**：{up_enabled}
          - **UP通知メッセージ**：
          ```
          {up_message_title}
          ``````
          {up_message}
          ```
          - **UPリマインド通知**：
          ```
          {up_remind_message_title}
          ``````
          {up_remind_message}
          ```
          - **UP通知ロール**：{up_mention}
        - "## レベリング機能設定"
        - |-
          - **レベリング機能**：{leveling_enabled}
  command.gopoint.view:
    - type: container
      components:
        - type: section
          accessory:
            type: thumbnail
            url: "{user_icon}"
          components:
            - "## {user_name}のGoポイント"
            - |-
              ### Goポイントの残高
              - **残高**：`{point} ポイント`
        - type: separator
          height: 2
        - |-
          ### Goポイントのランキング
          {ranking}
  command.gopoint.ranking:
    - type: container
      components:
        - "## 👑 {guild_name} Goポイントランキング"
        - |-
          ランキングの表示件数：`{limit} 件`
          -# {skip}件目以降を表示しています。
        - |-
          {ranking}
  command.gopoint.give.not_enough_point:
    - "あなたのGoポイントが不足しているため`{point} ポイント`を譲渡できません。"
    - "あなたの現在のGoポイントは`{current_point} ポイント`です。"
  command.gopoint.give.success:
    - "Goポイントの譲渡が完了しました。"
    - "`{point} ポイント`を`{target_user_name}`に譲渡しました。"
  command.play.high-and-low.start:
    - "{mention}"
    - type: container
      components:
        - "# ハイアンドロー"
        - |-
          ## ルール
          - ハイアンドローは、現在のカードよりも次のカードが高いか低いかを予想するゲームです。
          - 次のカードの数字が現在のカードよりも高いと予想する場合はHIGH、低いと予想する場合はLOWを選択してください。
          - 正解すると現在のポイントに、現在のポイント×ボーナス割合が加算されます。
          - 外すとゲームオーバーです。
          ### SAMEチャンス
          - 前回のカードと同じ数字が出た場合は、SAMEを予想することができます。
          - SAMEを予想して的中するとボーナス割合に、出た目の数×初期ボーナス割合が加算されます。
          - さらに、前回のカードと同じスートの場合は、現在のポイントに出た目の数×1.5が掛けられます。
          - SAMEを予想して外すとゲームオーバーです。
          ### 追加ポイント
          - 追加のポイントを支払うとポイントと倍率の初期値を増やすことができます。
        - type: separator
          height: 2
        - |-
          選択中の開始オプション: {selected_option}
          現在の残高: `{gopoint} ポイント`
          開始オプションを選択して「開始」ボタンを押すとゲームが開始します。
        - type: action_row
          components:
            - type: string_select_menu
              id: "play:hal_select_opt:{uuid}"
              placeholder: "開始オプションを選択してください"
              options: "hal_start_options"
        - type: action_row
          components:
            - type: button
              style: primary
              label: "開始"
              id: "play:hal_start:{uuid}"
  command.play.high-and-low.game:
    - "{mention}"
    - type: container
      components:
        - "## ハイアンドロー"
        - "### {turn}ターン目"
        - type: separator
          height: 2
        - |-
          ### **現在のカード**
          # {current_card}
