components:
  command.settings.view:
    - type: container
      components:
        - "# {guild_name}の設定"
        - type: separator
        - "## BUMP通知設定"
        - |-
          - **Bump通知**：{bump_enabled}
          - **Bump通知メッセージ**：
          ```
          {bump_message_title}
          ``````
          {bump_message}
          ```
          - **Bumpリマインド通知**：
          ```
          {bump_remind_message_title}
          ``````
          {bump_remind_message}
          ```
          - **Bump通知ロール**：{bump_mention}
        - "## UP通知設定"
        - |-
          - **UP通知**：{up_enabled}
          - **UP通知メッセージ**：
          ```
          {up_message_title}
          ``````
          {up_message}
          ```
          - **UPリマインド通知**：
          ```
          {up_remind_message_title}
          ``````
          {up_remind_message}
          ```
          - **UP通知ロール**：{up_mention}
        - "## レベリング機能設定"
        - |-
          - **レベリング機能**：{leveling_enabled}
  command.gopoint.view:
    - type: container
      components:
        - type: section
          accessory:
            type: thumbnail
            url: "{user_icon}"
          components:
            - "## {user_name}のGoポイント"
            - |-
              ### Goポイントの残高
              - **残高**：`{point} ポイント`
        - type: separator
          height: 2
        - |-
          ### Goポイントのランキング
          {ranking}
  command.gopoint.ranking:
    - type: container
      components:
        - "## 👑 {guild_name} Goポイントランキング"
        - |-
          ランキングの表示件数：`{limit} 件`
          -# {skip}件目以降を表示しています。
        - |-
          {ranking}
  command.gopoint.give.not_enough_point:
    - "あなたのGoポイントが不足しているため`{point} ポイント`を譲渡できません。"
    - "あなたの現在のGoポイントは`{current_point} ポイント`です。"
  command.gopoint.give.success:
    - "Goポイントの譲渡が完了しました。"
    - "`{point} ポイント`を`{target_user_name}`に譲渡しました。"
  command.play.high-and-low.game:
    - type: container
      components:
        - "## ハイアンドロー"
        - |-
          - **ターン**：{turn}
          - **現在のポイント**：`{point} ポイント`
          - **現在のカード**：{current_card}
          - **前回の選択**：**{last_choice}**
        - "### {message}"
        - type: action_row
          components:
            - type: button
              style: success
              label: "HIGH"
              id: "play:hal_high:{uuid}"
            - type: button
              style: danger
              label: "LOW"
              id: "play:hal_low:{uuid}"
            - type: button
              style: secondary
              label: "終了"
              id: "play:hal_cancel:{uuid}"
  command.play.high-and-low.result:
    - type: container
      components:
        - "## ハイアンドロー"
        - |-
          - **ターン**：{turn}
          - **結果**：`{point} ポイント`
          - **最後のカード**：{current_card}
          - **最後の選択**：**{last_choice}**
