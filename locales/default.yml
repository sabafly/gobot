    - "あなたの{currency_name}が不足しているため`{point} {currency_name}`を譲渡できません。"
    - "あなたの現在の{currency_name}は`{current_point} {currency_name}`です。"
  command.currency.give.success:
    - "通貨の譲渡が完了しました。"
    - "`{point} {currency_name}`を`{target_user_name}`に譲渡しました。"
  command.play.high-and-low.start:
    - "{mention}"
    - type: container
      components:
        - "# ハイアンドロー"
        - |-
          ## ルール
          - ハイアンドローは、現在のカードよりも次のカードが高いか低いかを予想するゲームです。
          - 次のカードの数字が現在のカードよりも高いと予想する場合はHIGH、低いと予想する場合はLOWを選択してください。
          - 正解すると現在の{currency_name}に、現在の{currency_name}×ボーナス割合が加算されます。
          - 外すとゲームオーバーです。
          ### SAMEチャンス
          - 前回のカードと同じ数字が出た場合は、SAMEを予想することができます。
          - SAMEを予想して的中するとボーナス割合に、出た目の数×初期ボーナス割合が加算されます。
          - さらに、前回のカードと同じスートの場合は、現在の{currency_name}に出た目の数×1.5が掛けられます。
          - SAMEを予想して外すとゲームオーバーです。
          ### 追加{currency_name}
          - 追加の{currency_name}を支払うと{currency_name}と倍率の初期値を増やすことができます。
        - type: separator
          height: 2
        - |-
          選択中の開始オプション: {selected_option}
          現在の残高: `{gopoint} {currency_name}`
          開始オプションを選択して「開始」ボタンを押すとゲームが開始します。
        - type: action_row
          components:
            - type: string_select_menu
              id: "play:hal_select_opt:{uuid}"
              placeholder: "開始オプションを選択してください"
              options: "hal_start_options"
        - type: action_row
          components:
            - type: button
              style: primary
              label: "開始"
              id: "play:hal_start:{uuid}"
  command.play.high-and-low.game:
    - "{mention}"
    - type: container
      components:
        - "## ハイアンドロー"
        - "### {turn}ターン目"
        - type: separator
          height: 2
        - |-
          ### **現在のカード**
          # {current_card}
          - **前回のカード**： {last_card}
          - **現在の{currency_name}**：`{point} {currency_name}` (ボーナス{multiplier}%)
          - **前回の選択**：**{last_choice}** 前回の結果：**{last_result}**
        - "### {message}"
        - type: action_row
          components:
            - type: button
              style: success
              label: "HIGH"
              id: "play:hal_high:{uuid}"
            - type: button
              style: secondary
              label: "SAME"
              id: "play:hal_same:{uuid}"
            - type: button
              style: danger
              label: "LOW"
              id: "play:hal_low:{uuid}"
        - type: action_row
          components:
            - type: button
              style: secondary
              label: "終了"
