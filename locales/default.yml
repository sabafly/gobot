  components.play.fx.err_session_expired: "⚠️ **セッションが期限切れです**: この取引画面のセッションは終了しました。もう一度 `/play fx` を実行してください。"
  components.play.fx.err_not_your_session: "⚠️ **他人のセッションです**: この取引画面は他のユーザーのものです。自分で `/play fx` を実行してください。"
  components.play.fx.err_restricted: "⚠️ **取引制限中**: 証拠金維持率が50%を下回っているポジションがあります。追加注文や決済を行う前に、追証を入金して警告状態を解消してください。"
  components.play.fx.rates_entry: "・**{symbol}**: Bid `{bid}` | Ask `{ask}` (スプレッド: `{spread}`)"
  components.play.fx.err_max_positions: "⚠️ **ポジション上限数到達**: 保有できるポジションは最大10個までです。いずれかのポジションを決済してから再度注文してください。"
  components.play.fx.liquidation_detail_header: "\n\n**損失補填のために強制決済された他のポジション:**"
  components.play.fx.liquidation_detail_item: "\n• `{symbol}` ({direction}) | 証拠金: `{margin} pt` | 決済価格: `{exit}` | 損益: `{pnl} pt` (回収額: `{val} pt`)"
  components.play.fx.liquidation_detail_deficit: "\n\n⚠️ **未回収の不足金**: `-{deficit} pt`（ポイント残高が不足しているため回収できませんでした）"
components:
  command.settings.view:
    - type: container
      components:
        - "# {guild_name}の設定"
        - type: separator
        - "## BUMP通知設定"
        - |-
          - **Bump通知**：{bump_enabled}
          - **Bump通知メッセージ**：
          ```
          {bump_message_title}
          ``````
          {bump_message}
          ```
          - **Bumpリマインド通知**：
          ```
          {bump_remind_message_title}
          ``````
          {bump_remind_message}
          ```
          - **Bump通知ロール**：{bump_mention}
        - "## UP通知設定"
        - |-
          - **UP通知**：{up_enabled}
          - **UP通知メッセージ**：
          ```
          {up_message_title}
          ``````
          {up_message}
          ```
          - **UPリマインド通知**：
          ```
          {up_remind_message_title}
          ``````
          {up_remind_message}
          ```
          - **UP通知ロール**：{up_mention}
        - "## レベリング機能設定"
        - |-
          - **レベリング機能**：{leveling_enabled}
  command.gopoint.view:
    - type: container
      components:
        - type: section
          accessory:
            type: thumbnail
            url: "{user_icon}"
          components:
            - "## {user_name}のGoポイント"
            - |-
              ### Goポイントの残高
              - **残高**：`{point} ポイント`
        - type: separator
          height: 2
        - |-
          ### Goポイントのランキング
          {ranking}
  command.gopoint.ranking:
    - type: container
      components:
        - "## 👑 {guild_name} Goポイントランキング"
        - |-
          ランキングの表示件数：`{limit} 件`
          -# {skip}件目以降を表示しています。
        - |-
          {ranking}
  command.gopoint.give.not_enough_point:
    - "あなたのGoポイントが不足しているため`{point} ポイント`を譲渡できません。"
    - "あなたの現在のGoポイントは`{current_point} ポイント`です。"
  command.gopoint.give.success:
    - "Goポイントの譲渡が完了しました。"
    - "`{point} ポイント`を`{target_user_name}`に譲渡しました。"
  command.play.high-and-low.start:
    - "{mention}"
    - type: container
      components:
        - "# ハイアンドロー"
        - |-
          ## ルール
          - ハイアンドローは、現在のカードよりも次のカードが高いか低いかを予想するゲームです。
          - 次のカードの数字が現在のカードよりも高いと予想する場合はHIGH、低いと予想する場合はLOWを選択してください。
          - 正解すると現在のポイントに、現在のポイント×ボーナス割合が加算されます。
          - 外すとゲームオーバーです。
          ### SAMEチャンス
          - 前回のカードと同じ数字が出た場合は、SAMEを予想することができます。
          - SAMEを予想して的中するとボーナス割合に、出た目の数×初期ボーナス割合が加算されます。
          - さらに、前回のカードと同じスートの場合は、現在のポイントに出た目の数×1.5が掛けられます。
          - SAMEを予想して外すとゲームオーバーです。
          ### 追加ポイント
          - 追加のポイントを支払うとポイントと倍率の初期値を増やすことができます。
        - type: separator
          height: 2
        - |-
          選択中の開始オプション: {selected_option}
          現在の残高: `{gopoint} ポイント`
          開始オプションを選択して「開始」ボタンを押すとゲームが開始します。
        - type: action_row
          components:
            - type: string_select_menu
              id: "play:hal_select_opt:{uuid}"
              placeholder: "開始オプションを選択してください"
              options: "hal_start_options"
        - type: action_row
          components:
            - type: button
              style: primary
              label: "開始"
              id: "play:hal_start:{uuid}"
  command.play.high-and-low.game:
    - "{mention}"
    - type: container
      components:
        - "## ハイアンドロー"
        - "### {turn}ターン目"
        - type: separator
          height: 2
        - |-
          ### **現在のカード**
          # {current_card}
          - **前回のカード**： {last_card}
          - **現在のポイント**：`{point} ポイント` (ボーナス{multiplier}%)
          - **前回の選択**：**{last_choice}** 前回の結果：**{last_result}**
        - "### {message}"
        - type: action_row
          components:
            - type: button
              style: success
              label: "HIGH"
              id: "play:hal_high:{uuid}"
            - type: button
              style: secondary
              label: "SAME"
              id: "play:hal_same:{uuid}"
            - type: button
              style: danger
              label: "LOW"
              id: "play:hal_low:{uuid}"
        - type: action_row
          components:
            - type: button
              style: secondary
              label: "終了"
              id: "play:hal_cancel:{uuid}"
  command.play.high-and-low.result:
    - "{mention}"
    - type: container
      components:
        - "## ハイアンドロー"
        - "### {turn}ターン"
        - type: separator
          height: 2
        - "## {final_state}"
        - type: separator
          height: 1
        - |-
          ### **最後のカード**
          # {current_card}
          - **前回のカード**: {last_card}
          - **結果**：`{point} ポイント` (ボーナス{multiplier}%)
          - **最後の選択**：**{last_choice}** 前回の結果：**{last_result}**
        - type: separator
          height: 2
        - type: button
          style: secondary
          label: 再挑戦
          id: "play:hal_retry:{option_index}"
  command.play.fx.order_screen:
    - type: container
      components:
        - "📈 **FX TRADING SIMULATOR** 📉"
        - type: separator
        - "### 💱 現在の為替レート"
        - "{rates_text}"
        - type: separator
        - "🪙 **保有 GoPoints**: `{points} pt`"
        - type: separator
        - "### 🆕 新規注文フォーム"
        - "{form_info}"
        - "{restriction_warning}"
        - type: action_row
          components:
            - type: string_select_menu
              id: "play:fx_symbol:{uuid}"
              placeholder: "1. 通貨ペアを選択"
              options: "symbol_options"
        - type: action_row
          components:
            - type: button
              style: primary
              label: "{btn_input_margin}"
              id: "play:fx_margin_btn:{uuid}"
        - type: action_row
          components:
            - type: string_select_menu
              id: "play:fx_leverage:{uuid}"
              placeholder: "3. レバレッジを選択"
              options: "leverage_options"
        - type: action_row
          components:
            - type: button
              style: success
              label: "🟢 買い (Buy)"
              id: "play:fx_buy:{uuid}"
            - type: button
              style: danger
              label: "🔴 売り (Sell)"
              id: "play:fx_sell:{uuid}"
            - type: button
              style: primary
              label: "レート更新"
              id: "play:fx_refresh:{uuid}"
            - type: button
              style: secondary
              label: "画面を閉じる"
              id: "play:fx_quit:{uuid}"
        - type: action_row
          components:
            - type: string_select_menu
              id: "play:fx_switch_pos:{uuid}"
              placeholder: "ポジションを選択して管理"
              options: "position_options"

  command.play.fx.position_screen:
    - type: container
      components:
        - "📈 **FX TRADING SIMULATOR** 📉"
        - type: separator
        - "### 💱 現在の為替レート"
        - "{rates_text}"
        - type: separator
        - "🪙 **保有 GoPoints**: `{points} pt`"
        - type: separator
        - "{position_info}"
        - "{restriction_warning}"
        - type: action_row
          components:
            - type: button
              style: success
              label: "ポジション決済 (利確/損切)"
              id: "play:fx_close:{uuid}"
            - type: button
              style: primary
              label: "追証を入金"
              id: "play:fx_add_margin_btn:{uuid}"
            - type: button
              style: primary
              label: "レート更新 / 損益確認"
              id: "play:fx_refresh:{uuid}"
            - type: button
              style: secondary
              label: "画面を閉じる"
              id: "play:fx_quit:{uuid}"
        - type: action_row
          components:
            - type: string_select_menu
              id: "play:fx_switch_pos:{uuid}"
              placeholder: "ポジションを選択して管理"
              options: "position_options"
